name: Android signed APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish this verified signed build as a public stable GitHub Release"
        required: true
        default: false
        type: boolean
      minimum_web_version:
        description: "Minimum compatible Shift Tracker Web App version"
        required: true
        default: "2.1.129"
        type: string
      release_notes:
        description: "Short public release notes"
        required: true
        default: "Native Android improvements"
        type: string
  push:
    paths:
      - "android-shell/**"
      - ".github/workflows/android-signed-apk.yml"

permissions:
  contents: read

jobs:
  build-signed-apk:
    name: Test and build signed APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-shell
    outputs:
      version_name: ${{ steps.release_assets.outputs.version_name }}
      version_code: ${{ steps.release_assets.outputs.version_code }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare protected release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SHIFT_TRACKER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHIFT_TRACKER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIFT_TRACKER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIFT_TRACKER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shift-tracker-release.jks"
          chmod 600 "$RUNNER_TEMP/shift-tracker-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/shift-tracker-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Run native tests and assemble signed release
        env:
          SHIFT_TRACKER_KEYSTORE_PATH: ${{ runner.temp }}/shift-tracker-release.jks
          SHIFT_TRACKER_KEYSTORE_PASSWORD: ${{ secrets.SHIFT_TRACKER_KEYSTORE_PASSWORD }}
          SHIFT_TRACKER_KEY_ALIAS: ${{ secrets.SHIFT_TRACKER_KEY_ALIAS }}
          SHIFT_TRACKER_KEY_PASSWORD: ${{ secrets.SHIFT_TRACKER_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest :app:assembleRelease :wear:assembleRelease

      - name: Verify portrait activity lock
        run: grep -F 'android:screenOrientation="portrait"' app/src/main/AndroidManifest.xml

      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          WEAR_APK="wear/build/outputs/apk/release/wear-release.apk"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='site.chatgpt.traynor1987.dominosshifttracker.stable'"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Verify signed Wear OS companion
        run: |
          set -euo pipefail
          APK="wear/build/outputs/apk/release/wear-release.apk"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='site.chatgpt.traynor1987.dominosshifttracker.stable'"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: shift-tracker-signed-apk
          path: |
            android-shell/app/build/outputs/apk/release/app-release.apk
            android-shell/app/build/outputs/apk/release/app-release.apk.sha256
            android-shell/wear/build/outputs/apk/release/wear-release.apk
            android-shell/wear/build/outputs/apk/release/wear-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Prepare public stable release assets
        id: release_assets
        shell: bash
        env:
          MINIMUM_WEB_VERSION: ${{ inputs.minimum_web_version || '2.1.145' }}
          RELEASE_NOTES: ${{ inputs.release_notes || 'Android and Wear update progress' }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          WEAR_APK="wear/build/outputs/apk/release/wear-release.apk"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          VERSION_NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")
          VERSION_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$BADGING")
          WEAR_BADGING=$("$BUILD_TOOLS/aapt" dump badging "$WEAR_APK")
          WEAR_VERSION_NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$WEAR_BADGING")
          WEAR_VERSION_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$WEAR_BADGING")
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          [[ "$MINIMUM_WEB_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_DIR="$RUNNER_TEMP/shift-tracker-release"
          mkdir -p "$RELEASE_DIR"
          RELEASE_APK="$RELEASE_DIR/Shift-Tracker-$VERSION_NAME.apk"
          RELEASE_WEAR="$RELEASE_DIR/Shift-Tracker-Wear-$WEAR_VERSION_NAME.apk"
          cp "$APK" "$RELEASE_APK"
          cp "$WEAR_APK" "$RELEASE_WEAR"
          SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          WEAR_SHA256=$(sha256sum "$RELEASE_WEAR" | awk '{print $1}')
          jq -n \
            --arg channel "stable" \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg minimumWebVersion "$MINIMUM_WEB_VERSION" \
            --arg apkFile "Shift-Tracker-$VERSION_NAME.apk" \
            --arg sha256 "$SHA256" \
            --arg wearName "$WEAR_VERSION_NAME" --argjson wearCode "$WEAR_VERSION_CODE" --arg wearFile "Shift-Tracker-Wear-$WEAR_VERSION_NAME.apk" --arg wearSha "$WEAR_SHA256" \
            --arg notes "$RELEASE_NOTES" \
            '{channel:$channel,versionName:$versionName,versionCode:$versionCode,minimumWebVersion:$minimumWebVersion,apkFile:$apkFile,sha256:$sha256,releaseNotes:($notes | split("\n") | map(select(length > 0))),wear:{versionName:$wearName,versionCode:$wearCode,asset:$wearFile,sha256:$wearSha}}' > "$RELEASE_DIR/shift-tracker-android-release.json"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_dir=$RELEASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: shift-tracker-public-release-bundle
          path: ${{ steps.release_assets.outputs.release_dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/shift-tracker-release.jks"

  publish-stable-release:
    name: Publish verified public stable release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: build-signed-apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: shift-tracker-public-release-bundle
          path: release-bundle

      - name: Guard public release versionCode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ needs.build-signed-apk.outputs.version_code }}
        run: |
          set -euo pipefail
          METADATA_URL=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .assets[] | select(.name == "shift-tracker-android-release.json") | .browser_download_url' | head -n1 || true)
          if [ -n "$METADATA_URL" ]; then
            PREVIOUS_CODE=$(curl --fail --silent --show-error --location "$METADATA_URL" | jq -r '.versionCode')
            test "$PREVIOUS_CODE" -lt "$VERSION_CODE"
          fi

      - name: Publish verified public stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build-signed-apk.outputs.version_name }}
          RELEASE_NOTES: ${{ inputs.release_notes || 'Android and Wear update progress' }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_NOTES"
          gh release create "v$VERSION_NAME" release-bundle/Shift-Tracker-"$VERSION_NAME".apk release-bundle/Shift-Tracker-Wear-*.apk release-bundle/shift-tracker-android-release.json --repo "$GITHUB_REPOSITORY" --title "Shift Tracker Android $VERSION_NAME" --notes "$RELEASE_NOTES" --latest
